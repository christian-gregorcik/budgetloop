[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolloop"
version = "0.1.0"
description = "The tool-calling loop, written out: schemas from type hints, parallel calls, budgets and a trace."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Christian Gregorcik" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.15.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
